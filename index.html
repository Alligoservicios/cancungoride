<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CancunGoRide</title>
  <style>
    /* Reset de márgenes y centrado completo */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #0d1117; /* Fondo oscuro elegante (puedes cambiarlo a #ffffff para blanco) */
      overflow: hidden;
    }

    /* Estilo del Reloj de Arena (SVG Animado) */
    .hourglass {
      width: 80px;
      height: 80px;
      color: #00d2ff; /* Color del reloj de arena (puedes cambiarlo al color de tu marca) */
      animation: flip 2s infinite ease-in-out;
    }

    /* Animación de rotación */
    @keyframes flip {
      0% {
        transform: rotate(0deg);
      }
      80% {
        transform: rotate(180deg);
      }
      100% {
        transform: rotate(180deg);
      }
    }
  </style>
</head>
<body>

  <!-- Icono de Reloj de Arena en SVG -->
  <svg class="hourglass" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5 22h14" />
    <path d="M5 2h14" />
    <path d="M17 22v-4.172a2 2 0 0 0-.586-1.414L12 12l-4.414 4.414A2 2 0 0 0 7 17.828V22" />
    <path d="M7 2v4.172a2 2 0 0 0 .586 1.414L12 12l4.414-4.414A2 2 0 0 0 17 6.172V2" />
  </svg>

</body>
</html>
